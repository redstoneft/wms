# Security headers for every WMS response. Included at `server` level AND inside every `location` that has its own
# add_header: in nginx, a single add_header in a location discards all headers inherited from the server block,
# which is how the SPA (/, /login, /assets/*) shipped without a Content-Security-Policy.
# Keep this file the only place these headers are defined.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# connect-src: /print-station talks to the local SAE label station (EstacionZebra.exe on 127.0.0.1:9101).
# worker-src: /station-tick.js Web Worker; WebGL needs blob: for workers/textures.
# img-src: label PNG previews and QR are data: URIs; WebAudio is generated in-page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:9101 http://localhost:9101; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

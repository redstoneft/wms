# WMS SPA: history fallback, /api proxy to the Fastify service, security headers.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip static assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # PWA manifest (Chrome needs the right MIME type to offer "Instalar app" on the handhelds)
  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # security headers (see nginx-security-headers.conf; re-included in every location that uses add_header)
  include /etc/nginx/snippets/wms-security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # API proxy (same origin → session cookie works, CSRF header preserved)
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 25m; # imports / photos
  }

  # hashed assets: cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/wms-security-headers.conf;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/wms-security-headers.conf;
    try_files $uri =404;
  }
  location /icons/ {
    expires 7d;
    try_files $uri =404;
  }

  # SPA history fallback
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/wms-security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}

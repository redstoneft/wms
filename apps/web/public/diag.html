<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WMS · Diagnóstico del equipo</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.4 -apple-system, Roboto, Arial, sans-serif; background: #fff; color: #111; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #ddd; }
  .k { color: #444; }
  .v { font-family: Menlo, monospace; font-weight: 700; text-align: right; word-break: break-all; }
  .ok { color: #1a7f37; } .bad { color: #b4232c; }
  .box { margin-top: 16px; padding: 12px; border: 2px solid #111; border-radius: 8px; }
  #sample { margin-top: 16px; padding: 14px; border-radius: 8px; font-weight: 700; }
  .swatch { background: oklch(20.8% 0.042 265.755); color: #fff; }
  button { margin-top: 16px; width: 100%; padding: 14px; font-size: 18px; font-weight: 700; border: 0; border-radius: 8px; background: #0369a1; color: #fff; }
  small { color: #555; display: block; margin-top: 10px; }
</style>
</head>
<body>
<h1>Diagnóstico del equipo</h1>
<div id="rows"></div>
<div id="sample" class="swatch">Si este recuadro se ve AZUL OSCURO con letras blancas, el navegador soporta los colores del WMS. Si se ve blanco o sin fondo, hay que actualizar Chrome.</div>
<div class="box">
  <div>Prueba de conexión con el servidor:</div>
  <div id="api" class="v">…</div>
</div>
<button onclick="navigator.clipboard && navigator.clipboard.writeText(document.getElementById('rows').innerText).then(function(){alert('Copiado. Pégalo en un mensaje.')}, function(){alert('No se pudo copiar; toma captura de pantalla.')})">Copiar resultado</button>
<small>Toma una captura de esta pantalla y envíala si algo sale en rojo.</small>
<script>
(function () {
  var ua = navigator.userAgent;
  var m = ua.match(/Chrome\/(\d+)/);
  var chrome = m ? parseInt(m[1], 10) : 0;
  var rows = [];
  function add(k, v, ok) { rows.push({ k: k, v: v, ok: ok }); }
  add('Navegador', ua.replace(/^Mozilla\/5\.0 /, ''), chrome >= 111);
  add('Versión de Chrome', chrome ? chrome : 'no es Chrome', chrome >= 111);
  add('Requisito', 'Chrome 111 o más nuevo', true);
  var sup = window.CSS && CSS.supports;
  add('Colores modernos (oklch)', sup ? (CSS.supports('color', 'oklch(50% 0.1 200)') ? 'sí' : 'NO') : 'no se puede saber', sup && CSS.supports('color', 'oklch(50% 0.1 200)'));
  add('color-mix', sup ? (CSS.supports('color', 'color-mix(in oklab, red, blue)') ? 'sí' : 'NO') : '?', sup && CSS.supports('color', 'color-mix(in oklab, red, blue)'));
  add('Cookies', navigator.cookieEnabled ? 'habilitadas' : 'DESHABILITADAS', navigator.cookieEnabled);
  add('Conexión segura (https)', location.protocol === 'https:' ? 'sí' : 'NO', location.protocol === 'https:');
  add('crypto.randomUUID', (window.crypto && typeof crypto.randomUUID === 'function') ? 'sí' : 'NO', !!(window.crypto && crypto.randomUUID));
  add('BigInt', typeof BigInt === 'function' ? 'sí' : 'NO', typeof BigInt === 'function');
  add('Modo app (pantalla completa)', (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ? 'sí' : 'no (abierto en Chrome)', true);
  add('Pantalla', screen.width + '×' + screen.height + ' @' + (window.devicePixelRatio || 1), true);
  add('Hora del equipo', new Date().toString(), true);
  add('Idioma', navigator.language, true);
  var html = '';
  rows.forEach(function (r) { html += '<div class="row"><span class="k">' + r.k + '</span><span class="v ' + (r.ok ? 'ok' : 'bad') + '">' + r.v + '</span></div>'; });
  document.getElementById('rows').innerHTML = html;
  var api = document.getElementById('api');
  var t0 = Date.now();
  fetch('/api/health/live', { credentials: 'include' }).then(function (r) {
    api.textContent = (r.ok ? 'OK' : 'ERROR ' + r.status) + ' · ' + (Date.now() - t0) + ' ms';
    api.className = 'v ' + (r.ok ? 'ok' : 'bad');
  }).catch(function (e) { api.textContent = 'SIN CONEXIÓN: ' + e; api.className = 'v bad'; });
})();
</script>
</body>
</html>

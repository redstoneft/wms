name: WMS CI

on:
  push:
  pull_request:

concurrency:
  group: wms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · unit · integration · security · concurrency · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: change-me-in-production
          POSTGRES_DB: wms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wms -d wms"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://wms:change-me-in-production@localhost:5432/wms
      DATABASE_URL_TEST: postgresql://wms:change-me-in-production@localhost:5432/wms_test
      APP_ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key-0123456789
      ALLOWED_ORIGINS: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Create test database
        run: PGPASSWORD=change-me-in-production psql -h localhost -U wms -d wms -c 'CREATE DATABASE wms_test'
      - name: Build shared package
        run: npm run build -w packages/shared
      - name: Typecheck
        run: npm run typecheck -w apps/api && npm run typecheck -w apps/web
      - name: Unit tests (shared + api)
        run: npm run test:unit
      - name: Migrate test DB
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - name: Integration + concurrency + security + fuzz tests
        run: npm run test:integration -w apps/api
      - name: Security audit of dependencies (high+)
        run: npm audit --audit-level=high --omit=dev || (echo "::warning::npm audit reported issues" && exit 0)
      - name: Build API and Web
        run: npm run build -w apps/api && npm run build -w apps/web
      - name: Backup/restore drill
        run: npx tsx scripts/backup-restore-test.ts
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

  e2e:
    name: Playwright E2E (critical flows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: change-me-in-production
          POSTGRES_DB: wms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wms -d wms"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://wms:change-me-in-production@localhost:5432/wms
      APP_ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key-0123456789
      ALLOWED_ORIGINS: http://localhost:5173
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w packages/shared
      - name: Migrate + seed demo
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts --demo
        working-directory: apps/api
      - name: Start API
        run: (npx tsx src/server.ts > /tmp/api.log 2>&1 &) && for i in $(seq 1 30); do curl -sf localhost:4000/api/health/ready && break || sleep 1; done
        working-directory: apps/api
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run E2E
        run: npm run test:e2e -w apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
